<div
  style="
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family:
      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
      sans-serif;
    color: #140736;
  "
>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding: 36px 16px">
        <table
          role="presentation"
          width="520"
          cellpadding="0"
          cellspacing="0"
          style="width: 520px; max-width: 520px"
        >
          <!-- Logo -->
          <tr>
            <td style="padding: 0 0 22px 0" align="left">
              <img
                src="https://platform.codetekt.org/codetekt_logo.png"
                alt="codetekt"
                width="140"
                style="display: block; border: 0"
              />
            </td>
          </tr>

          <!-- Subheadline -->
          <tr>
            <td style="padding: 0 0 8px 0">
              <div
                style="
                  font-size: 12px;
                  letter-spacing: 0.14em;
                  text-transform: uppercase;
                  color: #8c8c9f;
                "
              >
                Registrierung abschließen
              </div>
            </td>
          </tr>

          <!-- Headline -->
          <tr>
            <td style="padding: 0 0 14px 0">
              <div
                style="
                  font-size: 24px;
                  font-weight: 800;
                  letter-spacing: 0.02em;
                  text-transform: uppercase;
                "
              >
                E-Mail bestätigen
              </div>
            </td>
          </tr>

          <!-- Copy -->
          <tr>
            <td style="padding: 0 0 24px 0">
              <p style="margin: 0; font-size: 15px; line-height: 1.65">
                Bitte bestätige deine E-Mail-Adresse, um deinen
                <strong>codetekt</strong>-Account zu aktivieren.
              </p>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td align="left">
              <a
                href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                style="
                  display: inline-block;
                  background: #5f38fa;
                  color: #ffffff;
                  text-decoration: none;
                  padding: 12px 16px;
                  border-radius: 10px;
                  font-size: 14px;
                  font-weight: 700;
                  letter-spacing: 0.04em;
                  text-transform: uppercase;
                "
              >
                Jetzt bestätigen
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top: 32px">
              <p style="margin: 0; font-size: 12px; color: #8c8c9f">
                Wenn du dich nicht registriert hast, kannst du diese E-Mail
                ignorieren.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding-top: 8px">
              <p style="margin: 0; font-size: 12px; color: #8c8c9f">
                © codetekt
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
