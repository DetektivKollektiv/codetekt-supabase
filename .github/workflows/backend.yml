name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep every main release. Pull requests use separate groups per ref.
concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.115.0

jobs:
  test:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.4.0
      - name: Check migration history and warn about destructive SQL
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/check_migrations.py "$BASE_SHA" "$HEAD_SHA"
      - run: PYTHONPATH=scripts/ci python3 -m unittest scripts/ci/test_check_migrations.py
      - run: python3 scripts/deploy/test_deploy.py
      - run: bash -n scripts/deploy/*.sh
      - name: Run Edge Function unit tests
        run: >-
          deno test --allow-env
          supabase/functions/_shared/supabase-api-keys.test.ts
          supabase/functions/_wedium/schemas.test.ts
          supabase/functions/_wedium/aggregation.test.ts
      - name: Start Supabase and apply every migration to a fresh database
        run: supabase start -x studio,postgres-meta,logflare,vector,supavisor,imgproxy
      - name: Run pgTAP tests when present
        shell: bash
        run: |
          if compgen -G 'supabase/tests/*.sql' >/dev/null; then
            supabase test db
          else
            echo 'No pgTAP tests found under supabase/tests.'
          fi
      - name: Prepare disposable Edge Function environment
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          python3 scripts/ci/prepare_e2e.py "$RUNNER_TEMP/supabase-status.json" "$RUNNER_TEMP/functions.env"
      - name: Serve local Edge Functions
        run: |
          supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          python3 scripts/ci/wait_for_functions.py
      - name: Run backend E2E tests
        run: |
          deno test --allow-env --allow-net supabase/functions/tests/test_e2e.ts
          deno test --allow-env --allow-net supabase/functions/tests/wedium_e2e.ts
      - name: Upload Edge Function log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edge-functions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/functions.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy production backend
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: hetzner-production
      url: https://api.codetekt.org
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Build secret-free deployment bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bundle="$RUNNER_TEMP/backend-bundle"
          archive="$RUNNER_TEMP/backend-bundle.tgz"
          install -d "$bundle/bin" "$bundle/supabase"
          install -m 755 "$(command -v supabase)" "$bundle/bin/supabase"
          git archive --format=tar HEAD \
            supabase/config.toml supabase/migrations supabase/functions | tar -x -C "$bundle"
          rm -f "$bundle/supabase/functions/.env.example"
          if find "$bundle" -type f -name '.env*' -print -quit | grep -q .; then
            echo 'Refusing to package an environment file.' >&2
            exit 1
          fi
          tar -C "$bundle" -czf "$archive" .
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy through restricted SSH command
        env:
          DEPLOY_KEY: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.SSH_HOST }}
          ARCHIVE: ${{ steps.bundle.outputs.archive }}
          ARCHIVE_DIGEST: ${{ steps.bundle.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/backend_deploy_key' EXIT
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/backend_deploy_key
          chmod 600 ~/.ssh/backend_deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/backend_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "codetekt-backend-deploy@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA $GITHUB_RUN_NUMBER $ARCHIVE_DIGEST" < "$ARCHIVE"
